[package]
name = "tree-sitter-styled"
description = "styled-components grammar for the tree-sitter parsing library"
version = "0.0.1"
authors = ["Mark Skelton"]
license = "ISC"
readme = "README.md"
keywords = [
  "incremental",
  "parsing",
  "tree-sitter",
  "styled",
  "styled-components",
]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/mskelton/tree-sitter-styled"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
